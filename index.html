<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UI Segue • Rotating Squares π Approximation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>ui-segue — rotating squares → π</h1>
      <div class="controls">
        <label>
          Squares:
          <input id="countInput" type="number" min="1" max="720" value="36" />
        </label>
        <label>
          Deg/step:
          <input id="degInput" type="number" min="1" max="180" value="10" />
        </label>
        <label>
          Spawn ms:
          <input id="msInput" type="number" min="1" max="5000" value="120" />
        </label>
        <button id="startBtn">Start</button>
        <button id="resetBtn" class="ghost">Reset</button>
      </div>
    </header>

    <section class="stage">
      <canvas id="stage"></canvas>
      <div id="piOverlay" class="overlay">π ≈ —</div>
    </section>

    <footer>
      <p>
        The figure’s outer perimeter (convex hull of all square vertices) divided by the circle diameter
        gives an evolving approximation of <em>π</em>.
      </p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
